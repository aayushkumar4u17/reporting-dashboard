schema: 
  - "${VITE_GRAPHQL_SCHEMA_PATH:http://localhost:8080/v1/graphql}":
      headers:
        x-hasura-admin-secret: ${VITE_GRAPHQL_SCHEMA_PATH:myadminsecretkey}
documents: 
  - 'src/services/**/*.graphql'
  - 'src/api/**/*.graphql'
generates:
  src/sdk.ts:
    plugins:
      - '@graphql-codegen/typescript'
      - '@graphql-codegen/typescript-operations'
      - '@graphql-codegen/typescript-graphql-request'
    config:
      rawRequest: false
      skipTypename: false
      useTypeImports: true