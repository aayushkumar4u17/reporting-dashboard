query DashboardQuery($org_id: String!, $delivered_date: String!, $city: String!, $ordered_date: String!, $point_of_contact: String!) {
  pointOfContactDashboardReschedule(object: {org_id: $org_id, delivered_date: $delivered_date, city: $city, ordered_date: $ordered_date, point_of_contact: $point_of_contact}) {
    data {
      rescheduled_count
      rescheduled_qty
    }
  }
  pointOfContactDashboard(object: {org_id: $org_id, city: $city, delivered_date: $delivered_date, ordered_date: $ordered_date, point_of_contact: $point_of_contact}) {
    data {
      cancelled_count
      cancelled_qty
      delivered_orders
      order_count
      ordered_qty
      planned_orders
      planned_qty
      delivered_qty
    }
  }
}