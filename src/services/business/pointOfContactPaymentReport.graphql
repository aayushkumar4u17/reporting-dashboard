query PaymentsQuery($org_id: String!, $city: String!, $delivered_date: String!, $ordered_date: String!, $point_of_contact: String!) {
  pointOfContactPaymentReport(object: {org_id: $org_id, city: $city, delivered_date: $delivered_date, ordered_date: $ordered_date, point_of_contact: $point_of_contact}) {
    data {
      allowed_credit_breach
      credit_limit
      customer_id
      customer_name
      outstanding_amount
      overdue_amount
    }
  }
}